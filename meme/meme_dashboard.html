      label:{ show:true, position:'right', color:'#8b949e', fontSize:10, formatter: p => '$'+p.value+'B' }
    }]
  });
})();

// ── 折线图: PEPE 30日走势 ────────
(function(){
  const dates = CHART_DATA.map(p => {
    const d = new Date(p.timestamp);
    return d.getMonth()+1+'/'+d.getDate();
  });
  const prices = CHART_DATA.map(p => p.price);

  const chart = echarts.init(document.getElementById('chart-line'));
  chart.setOption({
    tooltip: { trigger:'axis' },
    grid: { left:70, right:30, top:10, bottom:30 },
    xAxis: { type:'category', data:dates, axisLabel:{color:'#8b949e',fontSize:10,rotate:30}, splitLine:{show:false} },
    yAxis: { type:'value', axisLabel:{color:'#8b949e',formatter:v=>'$'+v.toFixed(8)}, splitLine:{lineStyle:{color:'#21262d'}}, scale:true },
    series: [{
      type:'line', data:prices, smooth:true, symbol:'none',
      lineStyle:{color:'#58a6ff',width:2},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[
        {offset:0,color:'rgba(88,166,255,0.25)'},{offset:1,color:'rgba(88,166,255,0.02)'}
      ])}
    }]
  });
})();
</script>
</body>
</html>
